<!DOCTYPE html>
<!--
  Mundus Ulterior — Part 9's thin click-through UI, extended at Phase 2 Block A5.

  Open this file directly in a browser. No server, no build step, no CDN.
  It reads `data.js`, which is generated by `python ui/build_ui_data.py` from
  the archived runs in eval/answer_runs/, the 24 seed records in
  data/seed_corpus/, and — as of A5 — the place/gazetteer join in
  `ui/build_ui_data.py`'s `build_places()`, joining `ingest/places.py`'s
  validated placements against the cached coordinates in
  `data/gazetteer.json`.

  The design brief for Part 9 was: make it clickable, resist building
  measurement apparatus. So the one thing this page does properly is the thing
  the project's claim rests on — a quotation in an answer resolves to a named
  range of characters in a named field of a named file, and you can click it and
  see those characters. The Places tab (A5) extends the same discipline to
  geography: every point and every shaded region traces to a cached gazetteer
  id, never a hand-placed coordinate, and a placement with nowhere honest to
  draw it is listed rather than dropped.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mundus Ulterior — answers and their sources</title>

<header class="top">
  <div class="brand">
    <h1>Mundus Ulterior</h1>
    <span class="sub">Rome and the wider world, 27 BC – 1204 AD — answers traced to the characters they came from</span>
  </div>
  <div class="statstrip" id="statstrip"></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="questions" aria-selected="true">Questions</button>
    <button class="tab" role="tab" data-view="places"    aria-selected="false">Places</button>

  </div>

<main id="main"></main>

<script src="data.js"></script>
<script>
"use strict";

const D = window.MU_DATA;
const main = document.getElementById("main");

/* ------------------------------------------------------------------ *
 * helpers
 * ------------------------------------------------------------------ */
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

const LANGS = {
  en:"English", grc:"Ancient Greek", lzh:"Literary Chinese", oty:"Old Tamil",
  xpr:"Parthian", xna:"Nabataean Aramaic", xsa:"Sabaic", "gmq-pro":"Proto-Norse",
  gez:"Ge'ez", arc:"Aramaic", la:"Latin", da:"Danish",
  // Added in the UI block. The corpus carries twenty codes and this table
  // carried twelve, so a Middle Persian passage was labelled `pal` on screen.
  // Each name is the ISO 639-3 name for the code, confirmed against the record
  // that carries it rather than read off the code alone.
  pal:"Middle Persian", san:"Sanskrit", ocm:"Old Cham", omy:"Old Malay",
  non:"Old Norse", arb:"Arabic", ko:"Korean", vi:"Vietnamese", fr:"French",
  // FINDING 95: arabia-05-ruwafa's three chunks are not all in one language,
  // so the corpus reports `mul` where it reported `arc` throughout Block F.
  mul:"more than one language"
};
const langName = c => LANGS[c] || c || "unknown";

/* Every language code the corpus actually carries, so prose that lists them
   cannot go stale the way "Ancient Greek, Literary Chinese, Old Tamil,
   Parthian, Nabataean Aramaic, Sabaic, Proto-Norse and English" did between
   24 records and 54. */
function corpusLanguages() {
  const codes = new Set();
  for (const rec of Object.values(D.corpus))
    for (const c of rec.language_code || []) codes.add(c);
  return [...codes].filter(c => c !== "en").map(langName).sort();
}
const listOf = xs => xs.length < 2 ? (xs[0] || "")
  : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1];

/* ------------------------------------------------------------------ *
 * Phase 2, A5: places, grounds and the network subject_places implies.
 *
 * `ground` and `location_precision` are read here exactly as `PHASE2_PLAN.md`
 * and `PROGRESS.md` (A5) require them to be: two different axes, neither
 * standing in for the other, and `ground` is a CATEGORY, not a strength.
 * "stated on a Greek port and regional on a Chinese polity are different
 * kinds of claim, not different strengths of one" (PROGRESS.md, A5 trap 3) —
 * which is why grounds are told apart below by shape (pin vs. shaded extent)
 * and by an explicit "contested" flag, never by a colour gradient the way
 * `--good/--warn/--bad` reads elsewhere on this page. Reusing that palette
 * for `ground` would assert an ordering this project has explicitly refused.
 * ------------------------------------------------------------------ */
const GROUND_DESC = {
  stated:     "the record's own text names this place",
  identified: "a scholar has identified the ancient place with a modern location",
  regional:   "only the region is known — drawn as an area, never a pin",
};
const ROLE_DESC = {
  focus:       "the place the passage is organised around",
  source:      "goods, people or knowledge reach the focus from here",
  destination: "they leave the focus for here",
  waypoint:    "on the way, named as such — order among waypoints is not recorded",
  mentioned:   "named in the passage; nothing is said to move through it",
};
const P = D.places || { docs:{}, edges:[], groups:[], unconsidered:[],
                         declared_unplaceable:{}, uncached:[], stats:{} };

/* A map marker or an extent both need one coordinate to draw or connect
   edges to. A pin's coordinate is its cached representative point; an
   extent's is its bbox centroid, used only for drawing a LINE to it — never
   for a marker glyph, which is exactly the "regional falls back to a pin"
   defect A5 exists to refuse. */
function groupXY(g) {
  if (g.kind === "pin") return g.resolved.point;                 // [lon,lat]
  const [minLon,minLat,maxLon,maxLat] = g.resolved.bbox;
  return [(minLon+maxLon)/2, (minLat+maxLat)/2];
}

const groupsByKey = new Map((P.groups||[]).map(g => [g.cache_key, g]));

/* Every placement, findable by its `key` ("doc_id::block[index]"), across
   every document — including gaps, which carry no cache_key and so are not
   in `groupsByKey`. Built once rather than searched linearly on every click. */
const placeByKey = new Map();
for (const entries of Object.values(P.docs || {}))
  for (const e of entries) placeByKey.set(e.key, e);

/* Best-effort click-through from a placement to the characters that name it.
   `subject_places` and `findspot_places` carry no recorded character span —
   unlike Part 7's answer citations, nothing in Block A wrote an abs_start —
   so this SEARCHES the record's own fields for the place's name rather than
   reading an offset someone recorded. It is exactly the kind of match
   `cite.py` warns about elsewhere on this page (see `.caseonly`): plausible,
   not asserted as an exact citation. Labelled as a search result, not a
   citation, for the same reason. */
function cleanPlaceName(name) {
  return String(name || "")
    .replace(/^\s*the\s+/i, "")
    .replace(/\s*\([^)]*\)\s*$/, "")
    .trim();
}
function bestEffortLocate(rec, name) {
  if (!rec || !rec.fields) return null;
  const needle = cleanPlaceName(name);
  if (needle.length < 3) return null;
  for (const field of ["reference_translation", "original_text_excerpt"]) {
    const text = rec.fields[field];
    if (!text) continue;
    const at = text.indexOf(needle);
    if (at >= 0) return { field, start: at, end: at + needle.length };
    const atCf = text.toLowerCase().indexOf(needle.toLowerCase());
    if (atCf >= 0) return { field, start: atCf, end: atCf + needle.length };
  }
  return null;
}

/* Group the archive by question. Runs of the same question differ by prompt
   version, session and sampling — that variation is real and this project
   measured it, so the picker shows every run rather than a chosen best. */
const byQuestion = new Map();
for (const run of D.runs) {
  if (!byQuestion.has(run.question)) byQuestion.set(run.question, []);
  byQuestion.get(run.question).push(run);
}
for (const runs of byQuestion.values()) {
  runs.sort((a, b) => String(a.timestamp).localeCompare(String(b.timestamp)));
}
const QUESTIONS = [...byQuestion.keys()];

let state = {
  view: "questions",
  question: QUESTIONS[0],
  runIndex: null,       // null => pick the most interesting run
  selection: null       // { kind:"quote"|"passage"|"record", ... }
};

/* Default to a run that shows something: prefer grounded answers that actually
   quote, over refusals. Not because refusals are failures — one of them is the
   correct answer — but because an empty first screen misrepresents the system
   just as badly. The picker keeps every run one click away. */
function defaultRunIndex(runs) {
  let best = 0, bestScore = -1;
  runs.forEach((r, i) => {
    const quotes = (r.grounding?.quote_spans || [])
      .filter(s => s.abs_start != null).length;
    const score = quotes * 10 + (r.grounded ? 2 : 0) + (r.refused ? 0 : 1);
    if (score > bestScore) { bestScore = score; best = i; }
  });
  return best;
}

const currentRuns = () => byQuestion.get(state.question) || [];
const currentRun  = () => {
  const runs = currentRuns();
  const i = state.runIndex == null ? defaultRunIndex(runs) : state.runIndex;
  return runs[Math.min(i, runs.length - 1)];
};

function shortTime(ts) {
  const m = String(ts || "").match(/T(\d{2}):(\d{2})/);
  return m ? `${m[1]}:${m[2]}` : "—";
}

/* ------------------------------------------------------------------ *
 * FINDING 98. Every state `classify_span` can produce, rendered DELIBERATELY.
 *
 * `whitespace_only` (FINDING 42) reached neither renderer. In the answer it
 * fell through the class chain to "" -- visually a clean citation -- and
 * through the title chain to the pessimistic default, "this quotation no
 * longer resolves against the corpus". In the panel it matched no warnbox
 * branch and printed nothing. The picture said clean, the tooltip said broken,
 * and the panel said nothing; all three cannot be right, and the state it was
 * describing is the mildest of the six.
 *
 * It survived because every guard in `check_ui.mjs` asserts that a span is
 * PRESENT and HIGHLIGHTED, and this one was. So the fix is a table both
 * renderers read, plus `data-span-state` on the mark for `check_ui.mjs` to
 * assert against -- the `data-date-verdict` pattern, which exists because a
 * verdict that reaches the bundle and not the screen is the same defect one
 * layer down.
 *
 * `cls` is an ORDERING and is allowed to be one: it says whether the claim
 * still holds. That is the one axis on this page where a colour ramp is
 * honest.
 * ------------------------------------------------------------------ */
const SPAN_STATES = {
  resolved: {
    cls: "",
    title: "quoted from the source — click to see the characters on disk",
    box: null,
  },
  case_folded: {
    cls: " caseonly",
    title: "quoted with different letter case, and recorded as such — click to see the characters on disk",
    box: ["", "Not quite verbatim, and it says so.",
      `The characters below are what the file holds; the answer altered the case to fit
       its own sentence, and the citation checker recorded the match as
       <code>case_folded</code> rather than claiming it was exact. The character range
       is exact either way.`],
  },
  case_only: {
    cls: " caseonly",
    title: "quoted with different letter case — click for detail",
    box: [" warn", "Not quite verbatim.",
      `The characters below are what the file holds; the answer altered the case to
       fit its own sentence. This run was archived before <code>cite.py</code> had a
       third match state, so it recorded <code>exact</code>; that is a labelling
       defect in the archive and it is shown as it was claimed.`],
  },
  article_added: {
    cls: " caseonly",
    title: "quoted with an article the source does not have — click for detail",
    box: [" warn", "An article was added.",
      `The quotation carries a leading article the characters on disk do not. The
       character range is right; the quoted string is not what the file holds.`],
  },
  whitespace_only: {
    cls: " whitespace",
    title: "the archive and the record disagree about a line break — the characters are the quoted characters",
    box: ["", "A line break, and nothing else.",
      `The characters at this offset ARE the quoted characters once runs of whitespace
       are collapsed, which is how <code>cite.py</code> matches by design. The archive
       and the record disagree about one line break. FINDING 42: this is neither a
       broken claim nor a labelling defect, and it is counted and shown rather than
       tolerated silently, because a verifier made whitespace-insensitive would hide an
       edit that changed only spacing — a real edit to a record whose offsets other
       runs depend on.`],
  },
  moved: {
    cls: " unresolved",
    title: "the record was edited after this run — the quotation is still there, at a different offset",
    box: [" warn", "The text moved.", null],
  },
  absent: {
    cls: " unresolved",
    title: "this quotation no longer resolves against the corpus — click for detail",
    box: [" bad", "This citation no longer resolves.", null],
  },
  unclaimed: {
    cls: "",
    title: "verified in the English, but no character span claimed",
    box: null,
  },
};

/* ------------------------------------------------------------------ *
 * D1's SECOND AXIS, which `build_ui_data.py` has written onto all 1289 spans
 * since D1 and nothing on this page has ever read.
 *
 * The first axis asks whether the archived quote still sits at its recorded
 * offset. This one asks whether the RECORD moved underneath it — and the two
 * answer different questions, so they are never merged and `unrecorded` is
 * never collapsed into either neighbour. `corpus_provenance`'s docstring gives
 * the reason and it is the whole point: collapsing "unknown" into "unchanged"
 * would report a span as a real defect on no evidence, and collapsing it into
 * "changed" would explain away every real defect the archive holds.
 *
 * DELIBERATELY NOT COLOURED. `--good/--warn/--bad` asserts an ordering, and
 * this axis has none: a record that moved is not worse than one that did not,
 * and an archive that predates the corpus version is not a failure. The Places
 * tab already refuses that palette for `ground` for the same reason. So this
 * axis is told apart by LABEL, exactly as `ground` is told apart by SHAPE.
 * ------------------------------------------------------------------ */
const PROVENANCE = {
  unchanged: { label: "the record has not moved",
    gloss: `The seed record is byte-for-byte the one that produced this answer, so a
            failing span here would be a defect in the span and nothing else.` },
  changed: { label: "the record moved after this run",
    gloss: `The seed record was edited after this answer was archived — measured by
            comparing the run's recorded hash against the record's hash today, not
            inferred. It does not follow that the quotation broke: most did not.` },
  unrecorded: { label: "not knowable from the archive",
    gloss: `This run was archived before the corpus version was recorded, so whether
            the record has moved since cannot be told from the archive — and is not
            assumed either way. This is a third answer, not a soft "no".` },
  not_in_version: { label: "cited a record the run's corpus version does not cover",
    gloss: `The run recorded a corpus version and this document is not in it.` },
};

function provenanceSection(res) {
  const p = res && res.provenance;
  if (!p) return "";
  const d = PROVENANCE[p.state] || { label: p.state, gloss: "" };
  return `<div class="sect"><h3>has the record moved underneath this citation?</h3>
    <div class="provbox" data-provenance="${esc(p.state)}">
      <strong>${esc(d.label)}</strong>
      <div class="dormant" style="margin-top:6px">${d.gloss}</div>
      ${p.why ? `<div class="dormant" style="margin-top:6px">${esc(p.why)}</div>` : ""}
    </div></div>`;
}

/* ------------------------------------------------------------------ *
 * answer rendering: markers become buttons, quotations become clickable
 * highlights coloured by whether they still resolve to disk.
 * ------------------------------------------------------------------ */
function renderAnswerText(run) {
  const text = run.answer || "";
  const spans = run.grounding?.quote_spans || [];
  const ranges = [];

  // Locate each recorded quotation inside the answer prose. A quote may be
  // recorded more than once (the model repeats it); take the first unclaimed
  // occurrence so two identical quotations do not collapse onto one highlight.
  const taken = [];
  const overlaps = (a, b) => taken.some(t => a < t[1] && b > t[0]);
  spans.forEach((span, si) => {
    const q = (span.quote || "").trim();
    if (q.length < 3) return;
    let from = 0, at;
    while ((at = text.indexOf(q, from)) !== -1) {
      if (!overlaps(at, at + q.length)) {
        taken.push([at, at + q.length]);
        ranges.push({ start: at, end: at + q.length, kind: "quote", si });
        break;
      }
      from = at + 1;
    }
  });

  // Citation markers, skipping any that fall inside a quotation.
  for (const m of text.matchAll(/\[S\d+\]/g)) {
    const s = m.index, e = s + m[0].length;
    if (ranges.some(r => s < r.end && e > r.start)) continue;
    ranges.push({ start: s, end: e, kind: "marker", marker: m[0].slice(1, -1) });
  }

  ranges.sort((a, b) => a.start - b.start);

  let html = "", cursor = 0;
  for (const r of ranges) {
    if (r.start < cursor) continue;
    html += esc(text.slice(cursor, r.start));
    const body = esc(text.slice(r.start, r.end));
    if (r.kind === "marker") {
      // FINDING 99. This tag is emitted on ONE LINE and must stay on one
      // line: `brify` below is tag-aware now, but a tag broken across lines
      // is also a tag no reader of this function can see is fragile.
      html += `<button class="marker" data-marker="${esc(r.marker)}" title="source ${esc(r.marker)} — click to inspect">${body}</button>`;
    } else {
      const res = spans[r.si].resolution;
      const st = res?.state || "unclaimed";
      // No fall-through. An unknown state is rendered AS unknown and says so,
      // rather than borrowing the nearest branch's colour — which is the
      // shape of FINDING 98 and the reason this table exists.
      const d = SPAN_STATES[st] || {
        cls: " unknownstate",
        title: `this citation is in a state this page does not yet render (${st}) — click for detail`,
      };
      const prov = res?.provenance?.state || "unrecorded";
      html += `<mark class="q${d.cls}" data-span="${r.si}" data-span-state="${esc(st)}"`
            + ` data-provenance="${esc(prov)}" title="${esc(d.title)}">${body}</mark>`;
    }
    cursor = r.end;
  }
  html += esc(text.slice(cursor));

  /* FINDING 99. `p.replace(/\n/g, "<br>")` rewrote newlines ANYWHERE in the
     assembled markup, including inside an element's opening tag — which is
     what broke every citation marker on this page for the whole of its life.
     The button is on one line again, and this is tag-aware so that the next
     tag someone wraps for readability degrades into ugly source rather than
     into visible attribute text. A tag is passed through untouched; only a
     newline in the PROSE becomes a break. */
  const brify = h => h.replace(/<[^>]*>|\n/g, m => m === "\n" ? "<br>" : m);
  return html.split(/\n{2,}/).map(p => `<p>${brify(p)}</p>`).join("");
}

/* ------------------------------------------------------------------ *
 * the provenance panel — the point of the whole page
 * ------------------------------------------------------------------ */
const CONTEXT = 260;   // characters shown either side of a span

function fieldWithSpan(text, start, end) {
  const from = Math.max(0, start - CONTEXT);
  const to   = Math.min(text.length, end + CONTEXT);
  let html = "";
  if (from > 0) html += `<span class="snip">… ${from} characters before …\n\n</span>`;
  html += esc(text.slice(from, start));
  html += `<mark>${esc(text.slice(start, end))}</mark>`;
  html += esc(text.slice(end, to));
  if (to < text.length)
    html += `<span class="snip">\n\n… ${text.length - to} characters after …</span>`;
  return html;
}

function chainRow(k, v) {
  return v == null || v === "" ? ""
    : `<div><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`;
}

function renderQuoteProvenance(run, si) {
  const span = (run.grounding?.quote_spans || [])[si];
  if (!span) return `<p class="empty">No such quotation.</p>`;
  const rec = D.corpus[span.doc_id];
  const res = span.resolution;
  const passage = (run.passages || []).find(p => p.marker === span.marker);
  let out = "";

  out += `<p class="prov-q">“${esc(span.quote)}”</p>`;

  // FINDING 98: one table, both renderers, every state deliberate. The two
  // states with a `null` body keep their own sentence below, because each has
  // a figure to print that the table cannot hold.
  if (res) {
    const d = SPAN_STATES[res.state];
    if (!d) {
      out += `<div class="warnbox warn" data-span-state="${esc(res.state)}">
        <strong>This page does not yet render this citation's state.</strong>
        <code>${esc(res.state)}</code> was added to <code>classify_span</code> and not
        to this table. ${esc(res.why || "")} Shown as unknown rather than as the
        nearest state that happens to have a colour.</div>`;
    } else if (d.box) {
      const [sev, head, body] = d.box;
      const tail = body != null ? body
        : res.state === "absent"
          ? `${esc(res.why)}. The answer below is preserved exactly as it was produced;
             what has changed is the corpus underneath it. A viewer that printed whatever
             now sits at these coordinates would look entirely convincing and be wrong.`
          : `${esc(res.why)} It is now at [${res.now_at[0]}:${res.now_at[1]}].`;
      out += `<div class="warnbox${sev}" data-span-state="${esc(res.state)}">
        <strong>${head}</strong> ${tail}</div>`;
    } else {
      // `resolved` and `unclaimed` print no box — a box on every panel is a box
      // nobody reads — but the state still reaches the DOM so it can be asserted.
      out += `<span hidden data-span-state="${esc(res.state)}"></span>`;
    }
  }

  out += `<div class="chain">
    ${chainRow("quoted in", span.within === "english"
        ? "the published English translation" : "the source-language text")}
    ${chainRow("record", esc(rec ? rec.title : span.doc_id))}
    ${chainRow("file", `<code>${esc(rec ? rec.file : "—")}</code>`)}
    ${chainRow("field", `<code>${esc(span.source_field)}</code>`)}
    ${chainRow("characters", span.abs_start == null
        ? "<em>no character span claimed — verified in the English only</em>"
        : `<code>[${span.abs_start}:${span.abs_end}]</code>`)}
    ${chainRow("chunk", `<code>${esc(span.chunk_id)}</code>`)}
    ${chainRow("citation", rec && rec.citation
        ? `<a href="${esc(rec.citation)}" target="_blank" rel="noopener">${esc(rec.citation)}</a>` : null)}
  </div>`;

  const text = rec && rec.fields ? rec.fields[span.source_field] : null;
  if (text != null && span.abs_start != null && res && res.state !== "absent") {
    const s = res.state === "moved" ? res.now_at[0] : span.abs_start;
    const e = res.state === "moved" ? res.now_at[1] : span.abs_end;
    out += `<div class="sect"><h3>the characters on disk</h3>
      <div class="fieldtext">${fieldWithSpan(text, s, e)}</div></div>`;
  } else if (text != null) {
    out += `<div class="sect"><h3>the field as it stands today</h3>
      <div class="fieldtext">${esc(text.slice(0, 900))}${text.length > 900 ? "…" : ""}</div></div>`;
  }

  // When the quotation came from the English, show the source-language text it
  // translates. This is the cross-lingual claim made visible: an English answer
  // resting on a Greek, Chinese or Parthian passage.
  if (passage && passage.lang && passage.lang !== "en" && rec && rec.fields) {
    const orig = rec.fields.original_text_excerpt;
    if (orig && span.source_field !== "original_text_excerpt") {
      const slice = orig.slice(passage.char_start, passage.char_end) || orig;
      out += `<div class="sect"><h3>the ${esc(langName(passage.lang))} this rests on</h3>
        <div class="fieldtext">${esc(slice.slice(0, 700))}${slice.length > 700 ? "…" : ""}</div></div>`;
    }
  }

  out += provenanceSection(res);
  if (passage) out += renderEnglishProvenance(passage);
  return out;
}

/* The Part 6 confidence machinery. Every non-English passage in this corpus has
   an aligned published translation, so `machine` never fires and band/flags are
   null throughout. Hiding the controls would lose that work the moment Phase 2
   adds material with no published English; showing them as if they were live
   would be a lie. So they are shown, labelled dormant, with the reason. */
function renderEnglishProvenance(p) {
  const e = p.english || {};
  let out = `<div class="sect"><h3>how this reached English</h3>`;
  const KIND = {
    source: "The source is already in English — nothing was translated.",
    published: "A published scholarly translation, quoted as printed.",
    published_document: "A published translation of the whole document.",
    machine: "Machine translation, produced in-loop and scored.",
    none: "No English available for this passage."
  };
  out += `<div class="chain">
    ${chainRow("route", esc(KIND[e.kind] || e.kind || "—"))}
    ${chainRow("attribution", e.attribution ? esc(e.attribution) : null)}
    ${chainRow("alignment", e.ground ? esc({
        section: "matched on section numbers — the strongest pairing",
        index: "paired by position — both sides split into the same number of passages, which is weaker",
        self: "not applicable; the source is English",
        none: "no passage-level pairing claimed"
      }[e.ground] || e.ground) : null)}
    ${chainRow("reason", e.reason ? esc(e.reason) : null)}
  </div>`;

  if (e.band) {
    out += `<div class="chain">
      ${chainRow("confidence", `${esc(e.band)} (profile <code>${esc(e.profile || "—")}</code>${
        e.profile_calibrated === false ? ", <em>uncalibrated</em>" : ""})`)}
      ${chainRow("cosine", e.cos_back != null ? e.cos_back.toFixed(3) : null)}
      ${chainRow("chrF", e.chrf_back != null ? e.chrf_back.toFixed(3) : null)}
      ${chainRow("flags", (e.flags && e.flags.length) ? esc(e.flags.join(", ")) : "none")}
    </div>
    <div class="dormant">Bands are genre-relative and are <strong>not comparable across
    profiles</strong> — a “high” on verse and a “high” on prose do not describe the same
    strength of evidence.</div>`;
  } else if (e.kind === "published" || e.kind === "published_document" || e.kind === "source") {
    out += `<div class="dormant"><strong>Translation confidence: dormant.</strong>
      This passage reached English through a published translation, so the
      back-translation check does not apply and no band was assigned. Every
      non-English passage in this corpus has aligned published English, so the
      machine-translation path is never taken here. It exists, and is exercised
      only by offline tests, waiting on material that has no published
      translation.</div>`;
  }
  return out + `</div>`;
}

function renderPassageProvenance(run, marker) {
  const p = (run.passages || []).find(x => x.marker === marker);
  if (!p) return `<p class="empty">No such source.</p>`;
  const rec = D.corpus[p.doc_id];
  let out = `<p class="prov-q">${esc(rec ? rec.title : p.doc_id)}</p>`;

  if (run.partial_passages) {
    out += `<div class="warnbox warn">This run was reconstructed from a partial
      archive, so its passage records carry no language, region or citation.
      Those fields are shown from the seed record instead of being invented.</div>`;
  }

  out += `<div class="chain">
    ${chainRow("region", esc(rec ? rec.region : "—"))}
    ${chainRow("language", esc(langName(p.lang || (rec && rec.language_code && rec.language_code[0]))))}
    ${chainRow("kind", esc(rec ? rec.source_type : null))}
    ${chainRow("date", esc(rec ? rec.date : null))}
    ${chainRow("findspot", esc(rec ? rec.findspot : null))}
    ${chainRow("similarity", p.similarity != null ? p.similarity.toFixed(3) + " cosine to the question" : null)}
    ${chainRow("rank", p.rank != null ? "#" + p.rank + " of what was retrieved" : null)}
    ${chainRow("file", rec ? `<code>${esc(rec.file)}</code>` : null)}
    ${chainRow("field", `<code>${esc(p.source_field)}</code> [${p.char_start}:${p.char_end}]`)}
    ${chainRow("citation", rec && rec.citation
        ? `<a href="${esc(rec.citation)}" target="_blank" rel="noopener">${esc(rec.citation)}</a>` : null)}
  </div>`;

  if (rec && rec.fields) {
    const txt = rec.fields[p.source_field];
    if (txt != null) {
      const s = Math.max(0, p.char_start | 0), e = Math.min(txt.length, p.char_end | 0);
      out += `<div class="sect"><h3>the passage, as it sits in the file</h3>
        <div class="fieldtext">${fieldWithSpan(txt, s, e)}</div></div>`;
    }
  }
  if (p.english && p.english.text && p.source_field !== "reference_translation") {
    out += `<div class="sect"><h3>in English</h3>
      <div class="fieldtext">${esc(p.english.text)}</div></div>`;
  }
  out += renderEnglishProvenance(p);
  if (rec && rec.notes) {
    out += `<div class="sect"><h3>note on the record</h3>
      <div class="dormant">${esc(rec.notes)}</div></div>`;
  }
  return out;
}

function renderRecordProvenance(docId) {
  const rec = D.corpus[docId];
  if (!rec) return `<p class="empty">No such record.</p>`;
  let out = `<p class="prov-q">${esc(rec.title)}</p><div class="chain">
    ${chainRow("region", esc(rec.region))}
    ${chainRow("kind", esc(rec.source_type))}
    ${chainRow("language", (rec.language_code || []).map(langName).map(esc).join(", "))}
    ${chainRow("date", esc(rec.date))}
    ${chainRow("findspot", esc(rec.findspot))}
    ${chainRow("file", `<code>${esc(rec.file)}</code>`)}
    ${chainRow("citation", rec.citation
        ? `<a href="${esc(rec.citation)}" target="_blank" rel="noopener">${esc(rec.citation)}</a>` : null)}
    ${chainRow("translation", esc(rec.translation_source))}
  </div>`;
  const docPlaces = (P.docs || {})[docId];
  if (docPlaces && docPlaces.length) {
    out += `<div class="sect"><h3>places named in this record (${docPlaces.length})</h3>` +
      docPlaces.map(pl => `<div class="rec" data-place="${esc(pl.key)}">
        <div class="rec-title">${esc(pl.name)}
          <span class="ground-tag${pl.ground==="regional"?" regional":""}">${esc(pl.ground)}</span>
          ${pl.contested ? `<span class="ground-tag contested">contested</span>` : ""}</div>
        <div class="rec-meta">${pl.role ? esc(pl.role) + " — " : ""}${pl.kind === "gap" ? "not drawn on the map" : "on the map"}</div>
      </div>`).join("") + `</div>`;
  } else if (P.declared_unplaceable && P.declared_unplaceable[docId]) {
    out += `<div class="sect"><h3>geography</h3><div class="dormant">${esc(P.declared_unplaceable[docId])}</div></div>`;
  } else if ((P.unconsidered || []).includes(docId)) {
    out += `<div class="sect"><h3>geography</h3><div class="dormant">Not yet placed — part of the
      GeoNames backlog PROGRESS.md tracks (Pleiades has no entry for this record's places).</div></div>`;
  }
  for (const [field, label] of [["original_text_excerpt", "source text"],
                                ["reference_translation", "published translation"]]) {
    const t = rec.fields[field];
    if (t) out += `<div class="sect"><h3>${label} — <code>${field}</code>, ${t.length} characters</h3>
      <div class="fieldtext">${esc(t.slice(0, 1400))}${t.length > 1400 ? "…" : ""}</div></div>`;
  }
  if (rec.notes) out += `<div class="sect"><h3>note</h3><div class="dormant">${esc(rec.notes)}</div></div>`;
  return out;
}

/* ------------------------------------------------------------------ *
 * place / group / edge provenance — the Places tab's side panel.
 * Same job as the answer-run panels above: click something, see what it
 * rests on. Here "what it rests on" is a gazetteer id and a note, not a
 * character span, so the honest version of "characters on disk" is a
 * best-effort text search (`bestEffortLocate`), clearly labelled as one.
 * ------------------------------------------------------------------ */
function placeCoordText(pl) {
  if (pl.kind === "pin" && pl.resolved) {
    const [lon, lat] = pl.resolved.point;
    return `${lat.toFixed(3)}, ${lon.toFixed(3)}`;
  }
  if (pl.kind === "extent" && pl.resolved && pl.resolved.bbox) {
    const [a, b, c, d] = pl.resolved.bbox;
    return `extent ${b.toFixed(2)}–${d.toFixed(2)}° N, ${a.toFixed(2)}–${c.toFixed(2)}° E`;
  }
  return null;
}

/* The gazetteer's dates, against the record citing them.
 *
 * `ingest/gazetteer.py --check` has computed these verdicts since A6 and the
 * bundle did not carry them, so the page could not say that a point's dates do
 * not corroborate the record citing it. A marker on an entry attesting nothing
 * in this era looked exactly like one attesting the right century.
 *
 * Neither verdict is a failure and neither is styled as one:
 *   `hole`    — the entry's hull covers our window and every period it actually
 *               attests falls outside it. The placement can still be right; it
 *               means the gazetteer attests the place narrowly.
 *   `unknown` — could not be checked, and says which half is missing. Never
 *               shown as `ok`; a check that cannot tell has to say so.
 * `ok` and `no_dates` print nothing: a box on every panel is a box nobody reads,
 * and `no_dates` is simply correct for GeoNames, which carries no periods.
 *
 * `data-date-verdict` is on the box so `check_ui.mjs` can assert the page
 * surfaced it without matching prose.
 */
function dateVerdictBox(resolved) {
  const v = resolved && resolved.date_verdict;
  if (v !== "hole" && v !== "unknown") return "";
  const title = v === "hole"
    ? "The gazetteer attests this place, but not in this era."
    : "This entry's dates could not be checked.";
  return `<div class="warnbox warn" data-date-verdict="${esc(v)}">
    <strong>${title}</strong> ${esc(resolved.date_detail || "")}
    <div class="dormant" style="margin-top:6px">Not a failure, and not a reason
    to doubt the placement on its own — it is a prompt to look. The dates come
    from the gazetteer snapshot, not from the record.</div></div>`;
}

function renderPlaceProvenance(key) {
  const pl = placeByKey.get(key);
  if (!pl) return `<p class="empty">No such placement.</p>`;
  const rec = D.corpus[pl.doc_id];

  const tags = [`<span class="ground-tag${pl.ground === "regional" ? " regional" : ""}">${esc(pl.ground)}</span>`];
  if (pl.contested) tags.push(`<span class="ground-tag contested">contested</span>`);
  let out = `<p class="prov-q">${esc(pl.name)}</p><div class="badges">${tags.join("")}</div>`;

  out += `<div class="chain">
    ${chainRow("in record", rec ? esc(rec.title) : esc(pl.doc_id))}
    ${chainRow("block", `<code>${esc(pl.block)}[${pl.index}]</code>`)}
    ${chainRow("role", pl.role ? `${esc(pl.role)} — ${esc(ROLE_DESC[pl.role] || "")}` : null)}
    ${chainRow("ground", esc(GROUND_DESC[pl.ground] || pl.ground))}
    ${chainRow("gazetteer id", pl.uri
        ? `<a href="${esc(pl.uri)}" target="_blank" rel="noopener">${esc(pl.gazetteer)}:${esc(pl.gazetteer_id)}</a>` : null)}
    ${chainRow("coordinate", placeCoordText(pl))}
    ${chainRow("Pleiades precision", pl.resolved ? esc(pl.resolved.location_precision) : null)}
    ${chainRow("attested", pl.resolved && (pl.resolved.min_date || pl.resolved.max_date)
        ? `${esc(pl.resolved.min_date || "?")}..${esc(pl.resolved.max_date || "?")}` : null)}
  </div>`;

  if (pl.kind === "gap") {
    out += `<div class="warnbox warn"><strong>Not drawn on the map.</strong> ${esc(pl.gap_reason || "")}</div>`;
  }
  out += dateVerdictBox(pl.resolved);
  if (pl.ground_citation) {
    out += `<div class="sect"><h3>the identification</h3><div class="dormant">${esc(pl.ground_citation)}</div></div>`;
  }
  if (pl.contested && (pl.contested_citations || []).length) {
    out += `<div class="sect"><h3>both sides of the argument</h3>` +
      pl.contested_citations.map(c => `<div class="dormant" style="margin-bottom:6px">${esc(c)}</div>`).join("") +
      `</div>`;
  }
  if (pl.note) out += `<div class="sect"><h3>how this id was confirmed</h3><div class="dormant">${esc(pl.note)}</div></div>`;

  const loc = bestEffortLocate(rec, pl.name);
  if (loc && rec.fields[loc.field] != null) {
    out += `<div class="sect"><h3>the name, found in ${loc.field === "reference_translation" ? "the published translation" : "the source text"}</h3>
      <div class="fieldtext">${fieldWithSpan(rec.fields[loc.field], loc.start, loc.end)}</div>
      <div class="dormant" style="margin-top:6px">Located by searching the field for
      “${esc(cleanPlaceName(pl.name))}” — not a recorded citation span the way an answer's quotations
      are. <code>subject_places</code> and <code>findspot_places</code> carry no character offset;
      this is a text search, shown as one.</div></div>`;
  }

  out += `<div class="sect"><h3>the record</h3>
    <div class="rec" data-record="${esc(pl.doc_id)}" style="cursor:pointer">
      <div class="rec-title">${esc(rec ? rec.title : pl.doc_id)}</div>
      <div class="rec-meta">open the full record, source text and citation</div>
    </div></div>`;
  return out;
}

function renderGroupProvenance(cacheKey) {
  const g = groupsByKey.get(cacheKey);
  if (!g) return `<p class="empty">No such place.</p>`;
  const anyContested = g.members.some(m => m.contested);
  const docCount = new Set(g.members.map(m => m.doc_id)).size;

  let out = `<p class="prov-q">${esc(g.resolved.title)}</p><div class="badges">
    <span class="ground-tag${g.kind === "extent" ? " regional" : ""}">${g.kind === "pin" ? "point" : "extent"}</span>
    ${anyContested ? `<span class="ground-tag contested">a contested identification is among these</span>` : ""}
  </div>`;

  const coord = g.kind === "pin"
    ? `${g.resolved.point[1].toFixed(3)}, ${g.resolved.point[0].toFixed(3)}`
    : (() => { const [a, b, c, d] = g.resolved.bbox;
                return `extent ${b.toFixed(2)}–${d.toFixed(2)}° N, ${a.toFixed(2)}–${c.toFixed(2)}° E`; })();

  out += `<div class="chain">
    ${chainRow("gazetteer", `<code>${esc(cacheKey)}</code>`)}
    ${chainRow("coordinate", coord)}
    ${chainRow("Pleiades precision", esc(g.resolved.location_precision))}
    ${chainRow("attested", (g.resolved.min_date || g.resolved.max_date)
        ? `${esc(g.resolved.min_date || "?")}..${esc(g.resolved.max_date || "?")}` : null)}
    ${chainRow("attribution", (g.resolved.authors || g.resolved.creators)
        ? esc(g.resolved.authors || g.resolved.creators) : null)}
    ${chainRow("referenced by", `${g.members.length} placement${g.members.length === 1 ? "" : "s"} across
      ${docCount} record${docCount === 1 ? "" : "s"}`)}
  </div>`;

  out += dateVerdictBox(g.resolved);

  if (anyContested) {
    out += `<div class="warnbox warn">This coordinate is not treated the same way by every record that
      names it: some state it plainly, at least one records it as a contested identification. That is
      why this marker is drawn disputed rather than settled — open each placement below to read its own
      ground, not one shared pin's.</div>`;
  }

  out += `<div class="sect"><h3>placements at this point</h3>` +
    g.members.map(m => {
      const rec = D.corpus[m.doc_id];
      return `<div class="rec" data-place="${esc(m.key)}">
        <div class="rec-title">${esc(m.name)}
          <span class="ground-tag${m.ground === "regional" ? " regional" : ""}">${esc(m.ground)}</span>
          ${m.contested ? `<span class="ground-tag contested">contested</span>` : ""}</div>
        <div class="rec-meta">${esc(rec ? rec.title : m.doc_id)} · ${esc(m.block)}${m.role ? " · " + esc(m.role) : ""}</div>
      </div>`;
    }).join("") + `</div>`;
  return out;
}

function renderEdgeProvenance(idx) {
  const e = (P.edges || [])[idx];
  if (!e) return `<p class="empty">No such edge.</p>`;
  const rec = D.corpus[e.doc_id];

  let out = `<p class="prov-q">${esc(e.from_name)} → ${esc(e.to_name)}</p>
    <div class="badges"><span class="ground-tag">${esc(e.role)}</span>
    ${e.drawable ? "" : `<span class="ground-tag contested">not drawn on the map</span>`}</div>`;
  out += `<div class="chain">
    ${chainRow("in record", rec ? esc(rec.title) : esc(e.doc_id))}
    ${chainRow("relation", esc(ROLE_DESC[e.role] || ""))}
  </div>`;
  if (!e.drawable) out += `<div class="warnbox warn"><strong>Not drawn.</strong> ${esc(e.gap_reason || "")}</div>`;
  out += `<div class="sect"><h3>the two places</h3>
    <div class="rec" data-place="${esc(e.from_key)}"><div class="rec-title">${esc(e.from_name)}</div></div>
    <div class="rec" data-place="${esc(e.to_key)}"><div class="rec-title">${esc(e.to_name)}</div></div>
    </div>`;
  return out;
}

function renderPanel() {
  const sel = state.selection;
  if (!sel) {
    return `<p class="empty">Click a highlighted quotation, a citation marker, a source,
      or — on the Places tab — a point, a shaded region or a line. Every quotation in an
      answer resolves to a range of characters in a named field of a named file, and this
      panel shows you those characters.</p>`;
  }
  if (sel.kind === "record")  return renderRecordProvenance(sel.docId);
  if (sel.kind === "place")   return renderPlaceProvenance(sel.key);
  if (sel.kind === "group")   return renderGroupProvenance(sel.cacheKey);
  if (sel.kind === "edge")    return renderEdgeProvenance(sel.idx);
  const run = currentRun();
  if (sel.kind === "quote")   return renderQuoteProvenance(run, sel.si);
  if (sel.kind === "passage") return renderPassageProvenance(run, sel.marker);
  return "";
}

/* ------------------------------------------------------------------ *
 * views
 * ------------------------------------------------------------------ */
function viewQuestions() {
  const runs = currentRuns();
  const run  = currentRun();
  const activeIndex = runs.indexOf(run);
  const quotes = (run.grounding?.quote_spans || []).filter(s => s.abs_start != null).length;

  const qlist = QUESTIONS.map(q => {
    const rs = byQuestion.get(q);
    const grounded = rs.filter(r => r.grounded).length;
    const refused  = rs.filter(r => r.refused).length;
    return `<button class="qbtn" data-question="${esc(q)}"
      aria-current="${q === state.question}">${esc(q)}
      <span class="meta">${rs.length} archived run${rs.length === 1 ? "" : "s"} ·
      ${grounded} grounded · ${refused} refused</span></button>`;
  }).join("");

  const runbar = runs.map((r, i) => {
    const cls = r.refused ? "refused" : r.grounded ? "" : "ungrounded";
    return `<button class="runchip" data-run="${i}" aria-current="${i === activeIndex}"
      title="${esc(r.timestamp)} · ${esc(r.prompt_version)}">
      <span class="dot ${cls}"></span>${shortTime(r.timestamp)}
      <span style="opacity:.6">${esc((r.prompt_version || "").replace("p7-answer-", ""))}</span>
    </button>`;
  }).join("");

  const badges = [
    run.refused ? `<span class="badge neutral">no answer in these sources</span>`
                : `<span class="badge ${run.grounded ? "good" : "bad"}">${
                    run.grounded ? "every claim carries a citation" : "failed a grounding check"}</span>`,
    quotes ? `<span class="badge">${quotes} quotation${quotes === 1 ? "" : "s"} traced to disk</span>` : "",
    `<span class="badge">${(run.passages || []).length} sources consulted</span>`,
    `<span class="badge neutral mono">${esc(run.prompt_version || "")}</span>`
  ].join("");

  const refusalNote = run.refused ? `<div class="refusal-note">
    <strong>These sources don't answer this question.</strong> Rather than fill the
    gap, the system says so. Everything it searched is listed below.</div>` : "";

  const sources = (run.passages || []).map(p => {
    const rec = D.corpus[p.doc_id];
    const sim = p.similarity != null ? Math.max(0, Math.min(1, (p.similarity - 0.3) / 0.35)) : 0;
    const quoted = (run.grounding?.quote_spans || []).some(s => s.marker === p.marker);
    const lang = p.lang || (rec && rec.language_code && rec.language_code[0]);
    return `<div class="src" data-marker="${esc(p.marker)}">
      <div class="src-head">
        <span class="src-marker">${esc(p.marker)}</span>
        <span class="src-title">${esc(rec ? rec.title : p.doc_id)}</span>
      </div>
      <div class="src-meta">
        <span>${esc(rec ? rec.region : "—")}</span>
        <span>${esc(langName(lang))}</span>
        ${quoted ? `<span style="color:var(--accent)">quoted</span>` : `<span>consulted</span>`}
        ${p.similarity != null ? `<span class="sim"><span class="simbar"><i style="width:${(sim*100).toFixed(0)}%"></i></span>${p.similarity.toFixed(2)}</span>` : ""}
      </div></div>`;
  }).join("");

  return `<div class="cols">
    <div class="rail"><h2>Questions asked</h2><div class="qlist">${qlist}</div>
      <div class="sect"><h3>runs of this question</h3>
      <div class="dormant">The same question, prompt and evidence produced different
      answers on different days. Every run is kept; none is hidden.</div></div>
    </div>

    <div>
      <div class="card">
        <p class="qtext">${esc(run.question)}</p>
        <div class="runbar">${runbar}</div>
      </div>
      <div class="card">
        <div class="badges">${badges}</div>
        ${refusalNote}
        <div class="answer" id="answer">${renderAnswerText(run)}</div>
      </div>
      <h2 style="font-family:system-ui,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-faint)">Sources this answer was given</h2>
      <div id="sources">${sources}</div>
    </div>

    <div class="rail-right panel"><h2>Provenance</h2>
      <div class="panel-inner" id="panel">${renderPanel()}</div></div>
  </div>`;
}

function regionCards() {
  const cited = new Map();
  for (const run of D.runs)
    for (const p of run.passages || [])
      cited.set(p.doc_id, (cited.get(p.doc_id) || 0) + 1);

  const regions = new Map();
  for (const [id, rec] of Object.entries(D.corpus)) {
    const r = rec.region || "Unplaced";
    if (!regions.has(r)) regions.set(r, []);
    regions.get(r).push([id, rec]);
  }

  return [...regions.entries()].sort().map(([region, recs]) => {
    const rows = recs.sort((a, b) => (a[1].title || "").localeCompare(b[1].title || ""))
      .map(([id, rec]) => {
        const n = cited.get(id) || 0;
        return `<div class="rec" data-record="${esc(id)}">
          <div class="rec-title">${esc(rec.title)}</div>
          <div class="rec-meta">${esc((rec.language_code || []).map(langName).join(", "))}
            · ${esc(rec.source_type || "")}
            · ${n ? `retrieved in ${n} run${n === 1 ? "" : "s"}` : "never retrieved"}</div>
        </div>`;
      }).join("");
    return `<div class="card region"><h3>${esc(region)}</h3>
      <div class="count">${recs.length} record${recs.length === 1 ? "" : "s"}</div>${rows}</div>`;
  }).join("");
}

/* ------------------------------------------------------------------ *
 * the map itself. A hand-rolled equirectangular projection over an SVG
 * viewBox, fit to whatever coordinates the corpus actually cached. No CDN,
 * no tile server, no build step — the page still opens from file://.
 *
 * This originally drew NO coastline, on the argument that "a traced coastline
 * would be the one shape on the page that came from nowhere citable." That was
 * wrong, and instructively so: *coordinates are never authored* governs
 * placements — claims about where a record's place is — while a coastline is
 * the reference frame those claims are read against. It carries provenance
 * like anything else here, and without it the map was unreadable. See
 * scripts/build_coastline.py and the A5 addendum in PROGRESS.md.
 * ------------------------------------------------------------------ */
/* Pan and zoom are held as a CENTRE plus a zoom factor, and the visible window
   is derived from them on every draw, rather than as an SVG transform on a
   group.

   A transform would be cheaper per frame, but it scales everything it contains:
   marker radii, stroke widths and type size would all grow with the zoom, and
   the label collision solver — which runs in pixel space — would be solving
   against the wrong geometry. Recomputing the window instead means `buildMap`
   stays a pure function of (data, window), the thing `check_ui.mjs` already
   calls with no arguments, and it buys a real feature: label collisions are
   re-solved at every zoom level, so the Konkan market-towns that have no room
   at the default view get their names back as you zoom into them. */
const mapState = { base: null, zoom: 1, cx: null, cy: null };
const MAP_MAX_ZOOM = 60;

function mapBase() {
  if (mapState.base !== null) return mapState.base;
  const groups = P.groups || [];
  if (!groups.length) return (mapState.base = false);

  const lons = [], lats = [];
  for (const g of groups) {
    if (g.kind === "pin") { lons.push(g.resolved.point[0]); lats.push(g.resolved.point[1]); }
    else { const [a, b, c, d] = g.resolved.bbox; lons.push(a, c); lats.push(b, d); }
  }
  const pad = 3;
  const lonMin = Math.min(...lons) - pad, lonMax = Math.max(...lons) + pad;
  const latMin = Math.min(...lats) - pad, latMax = Math.max(...lats) + pad;
  const W = 900, H = Math.max(320, Math.round(W * (latMax - latMin) / (lonMax - lonMin)));
  mapState.base = {
    W, H,
    spanLon: lonMax - lonMin,
    cx: (lonMin + lonMax) / 2,
    cy: (latMin + latMax) / 2,
  };
  return mapState.base;
}

/* The window is always W:H in shape, so latitude span follows from longitude
   span. Deriving one from the other is what stops a zoom from stretching the
   world — the projection is already equirectangular and distorts with latitude,
   and a second, accidental distortion on top of it would be untraceable. */
function mapWindow() {
  const b = mapBase();
  if (!b) return null;
  const spanLon = b.spanLon / mapState.zoom;
  const spanLat = spanLon * b.H / b.W;
  const cx = mapState.cx == null ? b.cx : mapState.cx;
  const cy = mapState.cy == null ? b.cy : mapState.cy;
  return {
    W: b.W, H: b.H,
    lonMin: cx - spanLon / 2, lonMax: cx + spanLon / 2,
    latMin: cy - spanLat / 2, latMax: cy + spanLat / 2,
  };
}

function buildMap() {
  const groups = P.groups || [];
  if (!groups.length) return `<p class="empty">No cached coordinates yet.</p>`;

  const view = mapWindow();
  const { W, H, lonMin, lonMax, latMin, latMax } = view;
  const x = lon => (lon - lonMin) / (lonMax - lonMin) * W;
  const y = lat => H - (lat - latMin) / (latMax - latMin) * H;

  let svg = `<rect class="sea" x="0" y="0" width="${W}" height="${H}"/>`;

  /* The coastline, from the dated Natural Earth snapshot in data/ (see
     scripts/build_coastline.py). Drawn first, under everything: it is the
     reference frame, not evidence, and it must never compete with a shaded
     `regional` extent, which is the one fill on this map that carries a claim.
     Absent snapshot degrades to the graticule alone rather than failing. */
  const coast = D.coastline;
  if (coast && coast.polygons) {
    // Each polygon is [exterior, hole, ...]. `fill-rule: evenodd` is what makes
    // the Caspian and the Black Sea render as water rather than as land, and it
    // only works because the snapshot keeps exteriors and holes distinguishable
    // — an earlier version emitted undifferentiated boundary rings and drew the
    // Indian Ocean as a continent. See scripts/build_coastline.py.
    let d = "";
    for (const rings of coast.polygons) {
      // Cheap reject by BOUNDING-BOX OVERLAP, not by "does any vertex fall
      // inside the window". The vertex test is wrong as soon as zoom exists:
      // zoomed into the middle of the Sahara, every vertex of Africa is
      // outside the window while the continent covers all of it, and the test
      // would drop the landmass exactly when it is the only thing on screen.
      const ext = rings[0];
      let rMinLon = Infinity, rMaxLon = -Infinity, rMinLat = Infinity, rMaxLat = -Infinity;
      for (const [lon, lat] of ext) {
        if (lon < rMinLon) rMinLon = lon;
        if (lon > rMaxLon) rMaxLon = lon;
        if (lat < rMinLat) rMinLat = lat;
        if (lat > rMaxLat) rMaxLat = lat;
      }
      if (rMaxLon < lonMin || rMinLon > lonMax || rMaxLat < latMin || rMinLat > latMax) continue;
      for (const ring of rings)
        d += "M" + ring.map(([lon, lat]) => `${x(lon).toFixed(1)},${y(lat).toFixed(1)}`).join("L") + "Z";
    }
    if (d) svg += `<path class="land" fill-rule="evenodd" d="${d}"/>`;
  }

  for (let lon = Math.ceil(lonMin / 10) * 10; lon <= lonMax; lon += 10)
    svg += `<line class="grat" x1="${x(lon).toFixed(1)}" y1="0" x2="${x(lon).toFixed(1)}" y2="${H}"/>`;
  for (let lat = Math.ceil(latMin / 10) * 10; lat <= latMax; lat += 10)
    svg += `<line class="grat" x1="0" y1="${y(lat).toFixed(1)}" x2="${W}" y2="${y(lat).toFixed(1)}"/>`;

  // edges under markers, so a line never obscures the point it reaches
  (P.edges || []).forEach((e, idx) => {
    if (!e.drawable) return;
    const a = placeByKey.get(e.from_key), b = placeByKey.get(e.to_key);
    const ga = a && groupsByKey.get(a.cache_key), gb = b && groupsByKey.get(b.cache_key);
    if (!ga || !gb) return;
    const [ax, ay] = groupXY(ga), [bx, by] = groupXY(gb);
    svg += `<line class="edge${e.role === "waypoint" ? " waypoint" : ""}" data-edge="${idx}"
      x1="${x(ax).toFixed(1)}" y1="${y(ay).toFixed(1)}" x2="${x(bx).toFixed(1)}" y2="${y(by).toFixed(1)}">
      <title>${esc(e.from_name)} → ${esc(e.to_name)} (${esc(e.role)})</title></line>`;
  });

  // regional extents next — shaded areas, never a marker glyph
  for (const g of groups) {
    if (g.kind !== "extent") continue;
    const [a, b, c, d] = g.resolved.bbox;
    // Clamped to a margin around the viewport: zoomed in, an extent's true
    // corners can sit tens of thousands of pixels off-canvas, and while the
    // SVG would clip them correctly the coordinates themselves get long enough
    // to bloat the markup and lose precision. Clamping changes nothing visible
    // — the clipped edge is off-screen either way.
    const M = 40;
    const cl = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const x0 = cl(x(a), -M, W + M), x1 = cl(x(c), -M, W + M);
    const y0 = cl(y(d), -M, H + M), y1 = cl(y(b), -M, H + M);
    if (x1 < -M || x0 > W + M || y1 < -M || y0 > H + M) continue;
    svg += `<rect class="extent" data-group="${esc(g.cache_key)}"
      x="${x0.toFixed(1)}" y="${y0.toFixed(1)}" width="${Math.max(x1 - x0, 3).toFixed(1)}" height="${Math.max(y1 - y0, 3).toFixed(1)}" rx="3">
      <title>${esc(g.resolved.title)} — regional (an area, not a pin)</title></rect>`;
  }

  // pins last, always on top
  for (const g of groups) {
    if (g.kind !== "pin") continue;
    const anyContested = g.members.some(m => m.contested);
    const [lon, lat] = g.resolved.point;
    const px = x(lon), py = y(lat), n = g.members.length;
    svg += `<g class="pin${anyContested ? " contested" : ""}" data-group="${esc(g.cache_key)}">
      <circle class="dot" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${n > 1 ? 5.5 : 4}"/>
      ${n > 1 ? `<text class="n" x="${px.toFixed(1)}" y="${(py + 2.8).toFixed(1)}">${n}</text>` : ""}
      <title>${esc(g.resolved.title)} (${n} placement${n === 1 ? "" : "s"})${anyContested ? " — a contested identification is among them" : ""}</title>
    </g>`;
  }

  /* Labels last, and deliberately not all of them. The Konkan coast alone
     carries a dozen Periplus market-towns inside a few hundred pixels; drawing
     every name produces an unreadable smear and, worse, an arbitrary one —
     whichever labels happened to be written last would win. So labels are
     placed in a deliberate order (most-referenced first, then extents, then
     the rest) and any that would collide with one already placed is dropped.
     Nothing is lost by it: every point on this map is clickable and every name
     is in the panel and the record lists below. A label is a convenience here,
     not the evidence. */
  // Marker positions are obstacles too, so a label never lands on a
  // neighbouring dot — but each is tagged with its own cache_key and skipped
  // when placing that group's own label. Without the exclusion every label
  // collides with the very marker it belongs to and the map renders with no
  // names at all, which is precisely what the first attempt did.
  const placed = groups.map(g => {
    const [lon, lat] = groupXY(g);
    return { x: x(lon) - 6, y: y(lat) - 6, w: 12, h: 12, own: g.cache_key };
  });
  const CHAR_W = 5.6, LINE_H = 12, GAP = 3;
  const fits = (bx, by, bw, self) =>
    bx >= 2 && bx + bw <= W - 2 && by >= 2 && by + LINE_H <= H - 2 &&
    !placed.some(p => p.own !== self &&
                      bx < p.x + p.w + GAP && bx + bw + GAP > p.x &&
                      by < p.y + (p.h || LINE_H) + 1 && by + LINE_H + 1 > p.y);

  // Pleiades titles carry scholarly apparatus a map cannot use: query marks
  // ("Mandagara?"), slashed alternates ("Adane/Athenae/Eudaimon Arabia"), and
  // administrative suffixes. The full string is always one click away in the
  // panel; on the map the first name is what a reader needs.
  const shortTitle = t => {
    let s = String(t).replace(/\s*\([^)]*\)\s*$/, "").split("/")[0].replace(/\?$/, "").trim();
    return s.length > 18 ? s.slice(0, 17) + "…" : s;
  };

  // Busiest nodes first, then regions, so that when the Konkan runs out of room
  // it is Muziris and Barygaza that keep their names, not whichever market-town
  // happened to sort last. Deterministic, and stated rather than incidental.
  const labelled = groups.slice().sort((a, b) => {
    if (a.members.length !== b.members.length) return b.members.length - a.members.length;
    if ((a.kind === "extent") !== (b.kind === "extent")) return a.kind === "extent" ? -1 : 1;
    return a.resolved.title.localeCompare(b.resolved.title);
  });

  for (const g of labelled) {
    const title = shortTitle(g.resolved.title);
    if (!title) continue;
    const [lon, lat] = groupXY(g);
    const w = title.length * CHAR_W;
    const px = x(lon), py = y(lat);
    const spots = g.kind === "pin"
      ? [[px + 8, py + 3.5], [px - 8 - w, py + 3.5],
         [px - w / 2, py - 9], [px - w / 2, py + 15]]
      : [[px - w / 2, py + 3.5]];
    for (const [lx, ly] of spots) {
      if (!fits(lx, ly - LINE_H + 3.5, w, g.cache_key)) continue;
      placed.push({ x: lx, y: ly - LINE_H + 3.5, w, h: LINE_H, own: null });
      svg += `<text class="lbl${g.kind === "extent" ? " extent" : ""}"`
           + ` x="${lx.toFixed(1)}" y="${ly.toFixed(1)}">${esc(title)}</text>`;
      break;
    }
  }

  return `<svg class="mapsvg" viewBox="0 0 ${W} ${H}">${svg}</svg>`;
}

function mapLegend() {
  return `<div class="maplegend">
    <span class="item"><svg width="14" height="14"><circle cx="7" cy="7" r="4" fill="var(--accent)" stroke="var(--paper)" stroke-width="1.3"/></svg>stated / identified — a specific place</span>
    <span class="item"><svg width="14" height="14"><circle cx="7" cy="7" r="4" fill="var(--paper)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="2 1.4"/></svg>a contested identification is among the placements here</span>
    <span class="item"><svg width="18" height="14"><rect x="2" y="2" width="14" height="10" rx="2" fill="var(--accent)" fill-opacity=".1" stroke="var(--accent)" stroke-opacity=".55" stroke-dasharray="3 2"/></svg>regional — the area Pleiades gives it; never a pin</span>
    <span class="item"><svg width="22" height="10"><line x1="1" y1="5" x2="21" y2="5" stroke="var(--accent)" stroke-opacity=".5" stroke-width="1.6"/></svg>source / destination — an edge <code>subject_places</code> draws</span>
    <span class="item"><svg width="22" height="10"><line x1="1" y1="5" x2="21" y2="5" stroke="var(--accent)" stroke-opacity=".4" stroke-width="1.4" stroke-dasharray="1 3"/></svg>waypoint — on the way; no order recorded among waypoints</span>
    ${D.coastline ? `<span class="item" style="color:var(--ink-faint)">Coastline: ${esc(D.coastline.source)}
      ${esc(D.coastline.scale)}, ${esc(D.coastline.terms)}, retrieved ${esc(D.coastline.retrieved)} —
      a modern reference frame, not evidence, and no ancient shoreline</span>` : ""}
    <span class="item" style="color:var(--ink-faint)">Labels are dropped where they would collide —
      every point is clickable and every name is listed below</span>
  </div>`;
}

/* What the map cannot draw, counted from the data rather than described.
   At 24 records the gaps were a footnote and the page treated them as one. At
   54 they are the majority of the geography, and a footnote that has become
   the finding is no longer a footnote. Every figure here is derived; none is
   written down. */
function placeLedger() {
  const all = Object.values(P.docs || {}).flat();
  const gaps = all.filter(e => e.kind === "gap");
  const focus = all.filter(e => e.role === "focus");
  const docsAllGap = Object.entries(P.docs || {})
    .filter(([, es]) => es.length && es.every(e => e.kind === "gap"));
  return {
    placements: all.length,
    gaps,
    gapsNoId: gaps.filter(e => e.gazetteer_id == null),
    gapsIdNoGeometry: gaps.filter(e => e.gazetteer_id != null),
    // Whether EVERY gap is `regional` is the question, so it is asked of the
    // data and not asserted. If a `stated` placement ever becomes undrawable
    // this sentence changes by itself instead of becoming false.
    groundsMissing: [...new Set(gaps.map(e => e.ground))],
    focusTotal: focus.length,
    focusGaps: focus.filter(e => e.kind === "gap"),
    docsAllGap,
    edgesTotal: (P.edges || []).length,
    edgesDrawable: (P.edges || []).filter(e => e.drawable).length,
    groups: (P.groups || []).length,
  };
}

function viewPlaces() {
  const stats = P.stats || {};
  const L = placeLedger();
  const allEntries = Object.entries(P.docs || {});
  const allGapDocs = L.docsAllGap;
  const partialGapEdges = (P.edges || []).filter(e => !e.drawable);

  const onlyRegional = L.groundsMissing.length === 1 && L.groundsMissing[0] === "regional";
  const notice = `<div class="notice"><strong>${L.groups} distinct point${L.groups === 1 ? "" : "s"} and
    extent${L.groups === 1 ? "" : "s"} are drawn, from ${L.placements} placement${L.placements === 1 ? "" : "s"};
    ${L.gaps.length} are not.</strong> Everything drawn comes from an id cached in
    <code>data/gazetteer.json</code> — nothing here is a hand-placed coordinate, and this block added none.
    <code>ground</code> is shown, not hidden: a <em>regional</em> claim draws as a shaded area and never as
    a pin, and a <em>contested</em> identification draws disputed, not settled. Lines are the edges
    <code>subject_places</code> exists to draw — <code>source → focus → destination</code> — drawn only
    where both ends have a cached coordinate.
    <div class="ledger" style="margin-top:14px">
      <div class="cell"><div class="num">${L.gaps.length}</div><div class="cap">placements the corpus names
        and this map cannot draw${onlyRegional ? ` — <b>every one of them <code>regional</code></b>.
        Not one <code>stated</code> or <code>identified</code> placement is missing` : ""}</div></div>
      <div class="cell"><div class="num">${L.gapsNoId.length}</div><div class="cap">of those took
        <b>no gazetteer id at all</b>. Read the notes: these are overwhelmingly refusals, not a backlog —
        an office is not a city, a people is not a place, and an empire is not the town on the Tiber</div></div>
      <div class="cell"><div class="num">${L.gapsIdNoGeometry.length}</div><div class="cap">took an id the
        gazetteer holds and <b>does not say where it is</b>. A cached entry with no geometry, listed rather
        than centred on a guess</div></div>
      <div class="cell"><div class="num">${L.docsAllGap.length}</div><div class="cap">record${L.docsAllGap.length === 1 ? "" : "s"}
        of the ${stats.documents_placed || 0} with any geography at all appear on this map
        <b>only in the lists below</b></div></div>
    </div></div>`;

  /* The finding this tab exists to state plainly, and it is structural rather
     than editorial: `focus` is the place a passage is ORGANISED AROUND, and
     ${L.focusGaps.length} of ${L.focusTotal} of them have nowhere to draw. The
     card quotes each record's own note rather than saying what these places
     are, because naming them would be making the identification the corpus
     deliberately refused. The notes were written by whoever curated the
     record; the arithmetic is this page's. */
  /* The sharpest thing this corpus's geography says, and every figure in it
     is counted rather than asserted: how often one gazetteer id is TAKEN, and
     how often the same id is named in a note and REFUSED. The id is not
     hardcoded — it is whichever id the notes argue about most, so this card
     goes away by itself if the corpus stops arguing about it. */
  const contestedId = (() => {
    const all = Object.values(P.docs || {}).flat();
    const refusals = {};
    for (const e of all.filter(x => x.kind === "gap"))
      for (const m of String(e.note || "").matchAll(/\b(pleiades)[:\s]*(\d{4,7})\b/gi))
        (refusals[`pleiades:${m[2]}`] = refusals[`pleiades:${m[2]}`] || []).push(e);
    let best = null;
    for (const [key, es] of Object.entries(refusals)) {
      const g = groupsByKey.get(key);
      if (!g || es.length < 2) continue;
      if (!best || es.length > best.refused.length) best = { key, group: g, refused: es };
    }
    return best;
  })();

  const contestedCard = contestedId ? `<div class="card">
    <h3 style="margin-top:0;font-family:system-ui,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint)">
      one coordinate, taken ${contestedId.group.members.length} time${contestedId.group.members.length === 1 ? "" : "s"}
      and refused ${contestedId.refused.length}</h3>
    <p style="font-size:15px;margin:2px 0 10px"><strong>${esc(contestedId.group.resolved.title)}
      (<code>${esc(contestedId.key)}</code>)</strong> is the id this corpus disagrees with itself about
      most. ${contestedId.group.members.length} placement${contestedId.group.members.length === 1 ? " takes" : "s take"} it
      and ${contestedId.refused.length} name it in a note in order to refuse it. The marker you can see on
      the map above is the first group; the second is not on the map at all, and this is the card that
      says so.</p>
    <div class="cols" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px">
      <div><h3 style="font-family:system-ui,sans-serif;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint);margin:0 0 4px">taken — drawn on the map</h3>
        ${contestedId.group.members.map(m => {
          const rec = D.corpus[m.doc_id];
          return `<div class="rec" data-place="${esc(m.key)}">
            <div class="rec-title">${esc(m.name)}</div>
            <div class="rec-meta">${esc(rec ? rec.title : m.doc_id)}</div></div>`;
        }).join("")}</div>
      <div><h3 style="font-family:system-ui,sans-serif;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint);margin:0 0 4px">named in a note, and refused</h3>
        ${contestedId.refused.map(e => {
          const rec = D.corpus[e.doc_id];
          return `<div class="rec" data-place="${esc(e.key)}">
            <div class="rec-title">${esc(e.name)}</div>
            <div class="rec-meta">${esc(rec ? rec.title : e.doc_id)}</div></div>`;
        }).join("")}</div>
    </div>
    <div class="dormant" style="margin-top:12px">Each refusal has its own reason and this page does not
      summarise them into one — open a name to read the note that refused it. What can be said without
      reading any of them is arithmetic: the same coordinate is right for two of these placements and
      wrong for ${contestedId.refused.length}, and a map that drew all of them would be asserting an
      identification this corpus declined ${contestedId.refused.length} times.</div>
  </div>` : "";

  const focusCard = L.focusGaps.length ? `<div class="card">
    <h3 style="margin-top:0;font-family:system-ui,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint)">
      the place the passage is organised around, with nowhere to draw it</h3>
    <p style="font-size:15px;margin:2px 0 6px"><strong>${L.focusGaps.length} of the ${L.focusTotal}
      <code>focus</code> placements in this corpus are gaps.</strong> A reader looking at the map above
      is looking at the places these texts mention in passing, while the place each text is actually
      about is absent from it. Each row gives the record's own reason, unedited.</p>
    ${L.focusGaps.map(e => {
      const rec = D.corpus[e.doc_id];
      // First sentence, unless it is a stub like "NO ID." -- several notes
      // open with one, and a card that prints only that has told the reader
      // nothing. Take sentences until there is something to read, and never
      // paraphrase: this is the curator's text, not the page's.
      const src = (e.note || e.gap_reason || "");
      const parts = src.split(/(?<=\.)\s+/);
      let why = "";
      for (const p of parts) { why += (why ? " " : "") + p; if (why.length >= 60) break; }
      if (why.length > 300) why = why.slice(0, 297).replace(/\s\S*$/, "") + "…";
      return `<div class="focusrow" data-place="${esc(e.key)}">
        <div class="rec-title">${esc(e.name)}</div>
        <div class="rec-meta">${esc(rec ? rec.title : e.doc_id)}</div>
        <div class="why">${esc(why)}</div></div>`;
    }).join("")}
  </div>` : "";

  const mapCard = `<div class="maparea">
    <div class="mapbar">
      <button class="mapbtn" data-zoom="in"    title="zoom in">+</button>
      <button class="mapbtn" data-zoom="out"   title="zoom out">−</button>
      <button class="mapbtn" data-zoom="reset" title="back to the full extent">Reset</button>
      <span class="maphint">scroll to zoom · drag to pan</span>
      <span class="mapzoom" id="mapzoom"></span>
    </div>
    <div id="mapholder">${buildMap()}</div>
    ${mapLegend()}</div>`;

  /* This was one card per document, which was proportionate when three
     records had no drawable geometry and is a wall of twenty-one cards now.
     One card, one row per record, every placement still individually
     clickable — nothing is dropped, the same names reach the same panels, and
     the list can be read. */
  const allGapCards = allGapDocs.length ? `<div class="card" style="grid-column:1/-1">
    <h3 style="margin-top:0;font-family:system-ui,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint)">
      considered — nothing in these records resolves to a drawable point</h3>
    <p class="rec-meta" style="margin:0 0 6px">Every name below is clickable and opens its own
      placement, with the id that was refused and the reason it was refused.</p>
    ${allGapDocs.map(([docId, entries]) => {
      const rec = D.corpus[docId];
      return `<div class="gapdoc">
        <div class="doct" data-record="${esc(docId)}">${esc(rec ? rec.title : docId)}
          <span class="rec-meta" style="display:inline">· ${entries.length} placement${entries.length === 1 ? "" : "s"}</span></div>
        <div class="names">${entries.map(e =>
          `<span data-place="${esc(e.key)}">${esc(e.name.split(/[—–]/)[0].trim())}</span>`).join(" · ")}</div>
      </div>`;
    }).join("")}</div>` : "";

  const edgeGapRows = partialGapEdges.map(e => {
    const rec = D.corpus[e.doc_id];
    const idx = (P.edges || []).indexOf(e);
    return `<div class="gaprow" data-edge="${idx}">
      <div class="rec-title">${esc(e.from_name)} → ${esc(e.to_name)} <span class="ground-tag">${esc(e.role)}</span></div>
      <div class="rec-meta">${esc(rec ? rec.title : e.doc_id)}</div>
    </div>`;
  }).join("");

  const unconsideredRows = (P.unconsidered || []).map(docId => {
    const rec = D.corpus[docId];
    return `<div class="miss-row" data-record="${esc(docId)}">
      <div class="rec-title">${esc(rec ? rec.title : docId)}</div>
      <div class="rec-meta">${esc(rec ? rec.region : "")} — not yet curated (the GeoNames backlog)</div>
    </div>`;
  }).join("");

  const unplaceableRows = Object.entries(P.declared_unplaceable || {}).map(([docId, reason]) => {
    const rec = D.corpus[docId];
    return `<div class="miss-row" data-record="${esc(docId)}">
      <div class="rec-title">${esc(rec ? rec.title : docId)}</div>
      <div class="rec-meta">${esc(reason)}</div>
    </div>`;
  }).join("");

  return `<div>
    ${notice}
    ${mapCard}
    ${contestedCard}
    ${focusCard}
    ${allGapCards}
    <div class="placards">
      <div class="card placard"><h3>edges named in the text, not drawn on the map
        (${partialGapEdges.length} of ${L.edgesTotal})</h3>
        ${edgeGapRows || `<p class="empty">none</p>`}</div>
      <div class="card placard"><h3>not yet placed</h3>${unconsideredRows || `<p class="empty">none</p>`}</div>
      <div class="card placard"><h3>declared unplaceable</h3>${unplaceableRows || `<p class="empty">none</p>`}</div>
    </div>
    <h2 style="font-family:system-ui,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-faint)">All ${Object.keys(D.corpus).length} records, by region</h2>
    <div class="cols" style="grid-template-columns:minmax(0,1fr) 400px">
      <div class="regiongrid">${regionCards()}</div>
      <div class="rail-right panel"><h2>Place</h2>
        <div class="panel-inner" id="panel">${renderPanel()}</div></div>
    </div>
  </div>`;
}

function viewAbout() {
  const a = D.span_audit || {};
  const problems = (D.span_problems || []);
  const grouped = new Map();
  for (const p of problems) {
    const k = `${p.doc_id}\u0000${p.field}\u0000${p.at}\u0000${p.state}`;
    if (!grouped.has(k)) grouped.set(k, { ...p, runs: 0 });
    grouped.get(k).runs++;
  }
  const rows = [...grouped.values()].sort((a, b) => b.runs - a.runs).map(p => `<div class="rec">
    <div class="rec-title mono">${esc(p.doc_id)}.${esc(p.field)}${esc(p.at)}</div>
    <div class="rec-meta">${esc(p.state || "")} — ${esc(p.why || "")}</div>
    <div class="rec-meta">“${esc(p.quote)}…” · <b>claimed by ${p.runs} archived
      run${p.runs === 1 ? "" : "s"}</b>${p.provenance ? ` · corpus provenance
      <code>${esc(p.provenance)}</code>` : ""}</div></div>`).join("");

  return `<div class="cols" style="grid-template-columns:minmax(0,1fr)">
    <div>
    <div class="card">
      <h3 style="margin-top:0">What this page is showing</h3>
      <p>Every answer here was produced by asking a question of a corpus of
      ${Object.keys(D.corpus).length} primary sources — inscriptions, literary texts, papyri and
      excavation records — drawn from seven regions Rome traded with or heard about, between
      27 BC and 1204 AD. Sources are in ${esc(listOf(corpusLanguages()))}, and English. An English
      question retrieves them in their own languages, and the answer quotes them.</p>
      <p>The claim worth checking is not that the answers read well. It is that
      <strong>every quotation resolves to a specific range of characters in a specific
      field of a specific file</strong>. Click any highlighted phrase to see those
      characters. Nothing on this page is generated live: these are
      ${D.runs.length} runs archived while the system was being built, replayed against
      the corpus as it stands today.</p>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Citations checked against the corpus, just now</h3>
      <p style="font-size:15px">Of <strong>${Object.values(a).reduce((n, v) => n + (v || 0), 0)}</strong>
      character spans claimed across every archived answer:</p>
      <div class="badges">
        <span class="badge good">${a.resolved || 0} hold exactly the quoted characters</span>
        ${a.case_folded ? `<span class="badge good">${a.case_folded} differ only in letter case, and say so</span>` : ""}
        <span class="badge warn">${a.case_only || 0} differ only in letter case</span>
        <span class="badge warn">${a.moved || 0} moved within the file</span>
        <span class="badge bad">${a.absent || 0} no longer resolve</span>
      </div>
      <p style="font-size:14.5px;color:var(--ink-soft)">The failures are worth more than
      the passes. The one that no longer resolves is not a bug in the answer — it quoted
      the Adulis translation correctly, and then the record was replaced with a fuller
      one. <strong>An archived citation is only valid against the corpus version that
      produced it</strong>, and nothing was recording corpus version. The
      ${a.case_only || 0} case-only spans are a labelling defect the citation checker
      no longer has: it falls back to a case-insensitive search and, since 2026-08-14,
      records that as <code>case_folded</code> instead of claiming an exact match. These
      spans were archived before that fix and are shown as they were claimed, because an
      archive that is quietly re-labelled is no longer evidence that the defect existed.</p>
      ${rows}
    </div>

    <div class="card">
      <h3 style="margin-top:0">And has the corpus moved underneath them?</h3>
      <p style="font-size:14.5px;color:var(--ink-soft)">The audit above asks whether an archived
      quotation still sits at the offset it recorded. That is not the same question as whether the
      <em>record</em> moved since — and until this page was rebuilt it could only ask the first.
      <code>build_ui_data.py</code> has measured the second for every span since D1, by comparing the
      hash the run recorded against the record's hash today. Neither is a summary of the other, and
      <strong>“not knowable” is a third answer and never a soft “no”</strong>: folding it into
      “unchanged” would call a span a defect on no evidence, and folding it into “changed” would
      explain away every real defect the archive holds.</p>
      ${(() => {
        const cross = {};
        let total = 0;
        for (const run of D.runs)
          for (const s of run.grounding?.quote_spans || []) {
            if (!s.resolution) continue;
            const k = s.resolution.state + "\u0000" + (s.resolution.provenance?.state || "unrecorded");
            cross[k] = (cross[k] || 0) + 1; total++;
          }
        const rows = Object.entries(cross).sort((a, b) => b[1] - a[1]).map(([k, n]) => {
          const [st, pv] = k.split("\u0000");
          // Every row is tagged, including the two `resolved` rows: they are
          // the same first-axis state with different second-axis answers, and
          // tagging only the failures would make the axis look like a
          // severity scale, which is the one thing it is not.
          return `<div class="chain"><div>
            <span class="k" style="width:150px">${esc(st)}</span>
            <span class="v">${n} span${n === 1 ? "" : "s"} — ${esc((PROVENANCE[pv] || {}).label || pv)}
            <span class="ground-tag${pv === "unrecorded" ? " contested" : ""}"
              style="margin-left:6px">${esc(pv)}</span></span></div></div>`;
        }).join("");
        // The two sentences this cross-tabulation makes available, derived so
