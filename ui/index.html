        // they cannot survive the data changing underneath them.
        const failing = Object.entries(cross).filter(([k]) => !k.startsWith("resolved\u0000"));
        const failingBroken = failing.filter(([k]) => /^(moved|absent|case_only|article_added)\u0000/.test(k));
        const allUnrec = failingBroken.every(([k]) => k.endsWith("\u0000unrecorded"));
        const brokenN = failingBroken.reduce((n, [, v]) => n + v, 0);
        const changedN = Object.entries(cross).filter(([k]) => k.endsWith("\u0000changed"))
          .reduce((n, [, v]) => n + v, 0);
        return rows + `<div class="dormant" style="margin-top:12px;line-height:1.6">
          ${allUnrec ? `<strong>Every one of the ${brokenN} citations that fails the first axis has
          provenance <code>unrecorded</code>.</strong> This project cannot say, of a single one of its
          failing citations, whether the failure is a defect in the span or the record moving underneath
          it — because every one of them was archived before the corpus version was recorded. That is a
          fact about when they were made, not about how good they are, and it is here rather than
          rounded off.` : `<strong>${brokenN} citation${brokenN === 1 ? "" : "s"} fail the first axis, and
          not all of them are in the unknowable bucket</strong> — the ones with a recorded provenance can
          be told apart from the ones without.`}
          <br><br><strong>And the mirror, which is the better half:</strong> the corpus moved under
          ${changedN} spans, and the archive still holds. <code>unchanged</code> is
          ${cross["resolved\u0000unchanged"] || 0} not because nothing survived but because W3 added two
          keys to all ${Object.keys(D.corpus).length} records in one commit, so every content hash moved
          at once. A span whose record is <code>changed</code> is explained, not defective.</div>`;
      })()}
    </div>

    <div class="card">
      <h3 style="margin-top:0">What this page does not show</h3>
      <p style="font-size:14.5px;color:var(--ink-soft)">The Places tab draws only what
      <code>data/gazetteer.json</code> has cached against a gazetteer id — ${(P.stats||{}).gaps||0}
      placements named in the corpus have no drawable coordinate, and are listed rather than guessed
      at. ${(P.unconsidered||[]).length === 0
        ? `Every record has now been considered geographically, which was not true at 24 records:
           what is left is not a backlog but a set of refusals, and the Places tab counts them.`
        : `${(P.unconsidered||[]).length} record(s) have not been geographically placed at all.`}
      <strong>No answer on this page is generated when you read it.</strong> All ${D.runs.length} runs
      were archived while the system was built, each one cost an API call, and each is replayed from
      disk and re-checked against the corpus as it stands today — which is why the two audits above
      can exist at all. That is a ruling, not a limitation waiting to be lifted: an answer generated
      at request time would be the one thing on this page nobody had scored, sitting in the same type
      as ${Object.values(D.span_audit||{}).reduce((n,v)=>n+(v||0),0)} citations that have been.
      The translation-confidence machinery is visible but dormant, because every non-English passage
      in this corpus already has a published English translation. And one question, on Aksumite
      trade, has failed to produce a grounded answer in every attempt under four different prompts,
      with the answer sitting in its own evidence in English. That is unexplained, and it is here
      rather than hidden.</p>
    </div>
    </div></div>`;
}

/* ------------------------------------------------------------------ *
 * wiring
 * ------------------------------------------------------------------ */
function statStrip() {
  const a = D.span_audit || {};
  const total = Object.values(a).reduce((n, v) => n + (v || 0), 0);
  const langs = new Set();
  for (const rec of Object.values(D.corpus)) (rec.language_code || []).forEach(l => langs.add(l));
  const ps = P.stats || {};
  document.getElementById("statstrip").innerHTML =
    `<span><b>${Object.keys(D.corpus).length}</b> primary sources</span>
     <span><b>${langs.size}</b> languages</span>
     <span><b>${D.runs.length}</b> archived answers</span>
     <span><b>${total}</b> citations, <b>${a.resolved || 0}</b> resolving to characters on disk</span>
     <span><b>${(P.groups||[]).length}</b> places drawn, <b>${ps.gaps||0}</b> named and not drawable,
       <b>${ps.edges_drawable||0}</b> of ${ps.edges_total||0} trade edges</span>`;
}

function render() {
  main.innerHTML = state.view === "questions" ? viewQuestions()
                 : state.view === "places"    ? viewPlaces()
                 : viewAbout();
  for (const t of document.querySelectorAll(".tab"))
    t.setAttribute("aria-selected", String(t.dataset.view === state.view));
}

function repaintPanel() {
  const el = document.getElementById("panel");
  if (el) { el.innerHTML = renderPanel(); el.scrollTop = 0; }
}

/* ------------------------------------------------------------------ *
 * map interaction: wheel to zoom about the cursor, drag to pan.
 *
 * Only the SVG is rebuilt, never the whole view — repainting `viewPlaces()`
 * on every wheel tick would also rebuild the record grid and the gap cards,
 * and would destroy the provenance panel's scroll position while the reader
 * is looking at it.
 * ------------------------------------------------------------------ */
let mapFrame = null;
function repaintMap() {
  if (mapFrame) return;                       // coalesce to one draw per frame
  mapFrame = (globalThis.requestAnimationFrame || (f => setTimeout(f, 16)))(() => {
    mapFrame = null;
    const holder = document.getElementById("mapholder");
    if (holder) holder.innerHTML = buildMap();
    const readout = document.getElementById("mapzoom");
    if (readout) readout.textContent = mapState.zoom > 1.01 ? `${mapState.zoom.toFixed(1)}×` : "";
  });
}

// Pixel position inside the SVG's own viewBox, which is what the projection
// is expressed in — not client pixels, since the SVG is width:100% and its
// on-screen size does not match its viewBox.
function mapPointerLonLat(svg, clientX, clientY) {
  const view = mapWindow();
  if (!view) return null;
  const r = svg.getBoundingClientRect();
  if (!r.width || !r.height) return null;
  const vx = (clientX - r.left) / r.width * view.W;
  const vy = (clientY - r.top) / r.height * view.H;
  return {
    lon: view.lonMin + vx / view.W * (view.lonMax - view.lonMin),
    lat: view.latMin + (1 - vy / view.H) * (view.latMax - view.latMin),
    vx, vy, view,
  };
}

function mapZoomBy(factor, anchor) {
  const before = mapWindow();
  if (!before) return;
  const next = Math.max(1, Math.min(MAP_MAX_ZOOM, mapState.zoom * factor));
  if (next === mapState.zoom) return;
  mapState.zoom = next;

  if (mapState.cx == null) { mapState.cx = mapBase().cx; mapState.cy = mapBase().cy; }
  if (anchor) {
    // Keep the lon/lat under the cursor pinned to the same screen position.
    const after = mapWindow();
    const fx = anchor.vx / before.W, fy = anchor.vy / before.H;
    mapState.cx = anchor.lon - (fx - 0.5) * (after.lonMax - after.lonMin);
    mapState.cy = anchor.lat + (fy - 0.5) * (after.latMax - after.latMin);
  }
  if (mapState.zoom === 1) { mapState.cx = null; mapState.cy = null; }   // snap home
  repaintMap();
}

function wireMap() {
  // Bound once, on document, so it survives every re-render of the view.
  if (wireMap.done) return;
  wireMap.done = true;

  document.addEventListener("wheel", ev => {
    const svg = ev.target.closest && ev.target.closest(".mapsvg");
    if (!svg) return;
    ev.preventDefault();                       // needs passive:false, below
    const anchor = mapPointerLonLat(svg, ev.clientX, ev.clientY);
    mapZoomBy(Math.pow(1.0015, -ev.deltaY), anchor);
  }, { passive: false });

  let drag = null;
  document.addEventListener("mousedown", ev => {
    const svg = ev.target.closest && ev.target.closest(".mapsvg");
    if (!svg || ev.button !== 0) return;
    const view = mapWindow();
    if (!view) return;
    if (mapState.cx == null) { mapState.cx = mapBase().cx; mapState.cy = mapBase().cy; }
    drag = { x: ev.clientX, y: ev.clientY, cx: mapState.cx, cy: mapState.cy,
             rect: svg.getBoundingClientRect(), view, moved: false, svg };
    svg.classList.add("dragging");
  });

  document.addEventListener("mousemove", ev => {
    if (!drag) return;
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 3) return;   // tolerate a shaky click
    drag.moved = true;
    const degPerPxX = (drag.view.lonMax - drag.view.lonMin) / drag.rect.width;
    const degPerPxY = (drag.view.latMax - drag.view.latMin) / drag.rect.height;
    mapState.cx = drag.cx - dx * degPerPxX;
    mapState.cy = drag.cy + dy * degPerPxY;
    repaintMap();
  });

  document.addEventListener("mouseup", () => {
    if (!drag) return;
    drag.svg.classList.remove("dragging");
    // A drag that moved must not also register as a click on whatever marker
    // happened to be under the pointer when the button came up.
    if (drag.moved) mapSuppressClick = true;
    drag = null;
  });
}
let mapSuppressClick = false;

document.addEventListener("click", ev => {
  // Swallow exactly one click after a pan, so dragging across the map does not
  // also select whichever marker the pointer was released over.
  if (mapSuppressClick) { mapSuppressClick = false; return; }

  const zoomBtn = ev.target.closest(".mapbtn");
  if (zoomBtn) {
    const how = zoomBtn.dataset.zoom;
    if (how === "reset") { mapState.zoom = 1; mapState.cx = null; mapState.cy = null; repaintMap(); }
    else mapZoomBy(how === "in" ? 1.6 : 1 / 1.6, null);
    return;
  }

  const tab = ev.target.closest(".tab");
  if (tab) { state.view = tab.dataset.view; state.selection = null; return render(); }

  const q = ev.target.closest(".qbtn");
  if (q) { state.question = q.dataset.question; state.runIndex = null;
           state.selection = null; return render(); }

  const rc = ev.target.closest(".runchip");
  if (rc) { state.runIndex = +rc.dataset.run; state.selection = null; return render(); }

  const mk = ev.target.closest("mark.q");
  if (mk) { state.selection = { kind: "quote", si: +mk.dataset.span }; return repaintPanel(); }

  const mrk = ev.target.closest(".marker, .src");
  if (mrk) { state.selection = { kind: "passage", marker: mrk.dataset.marker };
             return repaintPanel(); }

  // Places tab: a map marker, a shaded extent, an edge, or one placement's
  // own row (from a group's member list, an edge's endpoints, or a "not
  // drawable" list) — checked before the generic record click below, since
  // several of those rows sit inside a record link's own DOM subtree.
  const grp = ev.target.closest("[data-group]");
  if (grp) { state.selection = { kind: "group", cacheKey: grp.dataset.group };
             return repaintPanel(); }

  const edge = ev.target.closest("[data-edge]");
  if (edge) { state.selection = { kind: "edge", idx: +edge.dataset.edge };
              return repaintPanel(); }

  const place = ev.target.closest("[data-place]");
  if (place) { state.selection = { kind: "place", key: place.dataset.place };
               return repaintPanel(); }

  const rec = ev.target.closest("[data-record]");
  if (rec) { state.selection = { kind: "record", docId: rec.dataset.record };
             return repaintPanel(); }
});

statStrip();
wireMap();
render();
</script>
</body>
</html>
